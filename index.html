<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WhatsApp OAuth Meta</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0f;
      --surface: #141416;
      --surface2: #1c1c1f;
      --border: rgba(255,255,255,0.07);
      --border2: rgba(255,255,255,0.13);
      --text: #f0f0f2;
      --muted: #6b6b78;
      --muted2: #9999a8;
      --accent: #1877f2;
      --accent-hover: #1565d8;
      --success: #22c55e;
      --error: #ef4444;
      --warning: #f59e0b;
      --green-glow: rgba(34, 197, 94, 0.12);
      --blue-glow: rgba(24, 119, 242, 0.15);
    }

    html, body {
      height: 100%;
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      line-height: 1.6;
    }

    body {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 1.5rem 0 0.5rem;
    }

    .header-icon {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, #25d366, #128c7e);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .header-icon svg { width: 22px; height: 22px; fill: white; }
    .header-text h1 { font-size: 18px; font-weight: 600; letter-spacing: -0.3px; }
    .header-text p  { font-size: 13px; color: var(--muted2); margin-top: 2px; }

    .card {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: 14px;
      padding: 1.25rem;
    }

    .card-title {
      font-size: 12px; font-weight: 500;
      text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--muted); margin-bottom: 1rem;
    }

    .status-bar {
      display: flex; align-items: center; gap: 8px;
      padding: 0.6rem 0.9rem;
      border-radius: 8px;
      background: var(--surface2);
      border: 0.5px solid var(--border);
    }

    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--muted); flex-shrink: 0; transition: background 0.3s;
    }

    .status-dot.ready   { background: var(--success); box-shadow: 0 0 6px var(--success); }
    .status-dot.loading { background: var(--warning); animation: pulse 1s infinite; }
    .status-dot.error   { background: var(--error); }

    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

    .status-text { font-size: 13px; color: var(--muted2); font-family: 'DM Mono', monospace; }

    .field { margin-bottom: 0.75rem; }
    .field:last-child { margin-bottom: 0; }

    label {
      display: block; font-size: 12px; font-weight: 500;
      color: var(--muted2); margin-bottom: 6px; letter-spacing: 0.02em;
    }

    input {
      width: 100%;
      background: var(--surface2);
      border: 0.5px solid var(--border2);
      border-radius: 8px;
      padding: 10px 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px; color: var(--text); outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      -webkit-appearance: none;
    }

    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--blue-glow); }
    input::placeholder { color: var(--muted); }
    input.mono { font-family: 'DM Mono', monospace; font-size: 13px; }

    .config-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    .config-chip {
      background: var(--surface2); border: 0.5px solid var(--border);
      border-radius: 8px; padding: 10px 12px;
    }

    .config-chip .chip-label {
      font-size: 11px; color: var(--muted); font-weight: 500;
      text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px;
    }

    .config-chip .chip-value {
      font-family: 'DM Mono', monospace; font-size: 12px; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* Permissions badge list */
    .scopes-card {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: 14px;
      padding: 1.25rem;
    }

    .scopes-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 0.5rem;
    }

    .scope-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(24,119,242,0.1);
      border: 0.5px solid rgba(24,119,242,0.3);
      border-radius: 6px;
      padding: 4px 10px;
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: #60a5fa;
    }

    .scope-badge svg {
      width: 10px; height: 10px; fill: #60a5fa; flex-shrink: 0;
    }

    .btn-connect {
      width: 100%; background: var(--accent); color: white; border: none;
      border-radius: 10px; padding: 14px;
      font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 600;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      gap: 10px; transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
    }

    .btn-connect:hover  { background: var(--accent-hover); box-shadow: 0 4px 20px rgba(24,119,242,0.35); }
    .btn-connect:active { transform: scale(0.98); }
    .btn-connect svg    { width: 20px; height: 20px; }

    .steps { display: flex; gap: 6px; }

    .step {
      flex: 1; height: 3px; border-radius: 99px;
      background: var(--border2); transition: background 0.4s;
    }

    .step.active { background: var(--accent); }
    .step.done   { background: var(--success); }

    .log-wrap {
      background: var(--surface); border: 0.5px solid var(--border);
      border-radius: 14px; overflow: hidden;
    }

    .log-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.75rem 1.25rem; border-bottom: 0.5px solid var(--border);
    }

    .log-title {
      font-size: 12px; font-weight: 500; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.08em;
    }

    .btn-clear {
      background: none; border: 0.5px solid var(--border2); color: var(--muted2);
      font-size: 11px; font-family: 'DM Sans', sans-serif;
      padding: 3px 10px; border-radius: 5px; cursor: pointer; transition: color 0.2s;
    }

    .btn-clear:hover { color: var(--text); }

    #log {
      font-family: 'DM Mono', monospace; font-size: 12px; line-height: 1.7;
      padding: 1rem 1.25rem; height: 220px; overflow-y: auto; scroll-behavior: smooth;
    }

    .log-entry  { display: flex; gap: 10px; margin-bottom: 4px; }
    .log-ts     { color: var(--muted); flex-shrink: 0; user-select: none; }
    .log-msg    { color: var(--muted2); word-break: break-all; }
    .log-msg.success { color: var(--success); }
    .log-msg.error   { color: var(--error); }
    .log-msg.info    { color: #60a5fa; }
    .log-msg.warn    { color: var(--warning); }

    .result-box {
      display: none;
      background: var(--green-glow);
      border: 0.5px solid rgba(34,197,94,0.25);
      border-radius: 10px; padding: 1rem 1.25rem;
    }

    .result-box.show { display: block; }

    .result-box .result-label {
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
      color: #4ade80; font-weight: 500; margin-bottom: 6px;
    }

    .result-code {
      font-family: 'DM Mono', monospace; font-size: 12px;
      color: #86efac; word-break: break-all;
    }

    #log::-webkit-scrollbar       { width: 4px; }
    #log::-webkit-scrollbar-track { background: transparent; }
    #log::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 99px; }
  </style>
</head>
<body>

<div class="container">

  <div class="header">
    <div class="header-icon">
      <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
    </div>
    <div class="header-text">
      <h1>WhatsApp Business API</h1>
      <p>Embedded Signup — OAuth Meta</p>
    </div>
  </div>

  <div class="status-bar">
    <div class="status-dot ready" id="sdkDot"></div>
    <span class="status-text" id="sdkStatus">Pronto para autenticar</span>
  </div>

  <div class="card">
    <div class="card-title">Configuração do App</div>
    <div class="config-grid">
      <div class="config-chip">
        <div class="chip-label">App ID</div>
        <div class="chip-value" id="chipAppId">—</div>
      </div>
      <div class="config-chip">
        <div class="chip-label">Config ID</div>
        <div class="chip-value" id="chipConfigId">—</div>
      </div>
      <div class="config-chip" style="grid-column:1/-1">
        <div class="chip-label">Redirect URI</div>
        <div class="chip-value" id="chipRedirect">—</div>
      </div>
    </div>
  </div>

  <!-- Permissions badges -->
  <div class="scopes-card">
    <div class="card-title">Permissões OAuth solicitadas</div>
    <div class="scopes-list">
      <span class="scope-badge">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
        business_management
      </span>
      <span class="scope-badge">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
        whatsapp_business_management
      </span>
      <span class="scope-badge">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
        whatsapp_business_messaging
      </span>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Dados da Conexão</div>

    <div class="field">
      <label>App ID <span style="color:#ef4444">*</span></label>
      <input id="appId" type="text" class="mono" placeholder="960439420062430" oninput="refreshChips()" />
    </div>

    <div class="field">
      <label>Config ID (numérico) <span style="color:#ef4444">*</span></label>
      <input id="configId" type="text" class="mono" placeholder="977458031900449" oninput="refreshChips()" />
    </div>

    <div class="field">
      <label>Redirect URI — deve ser idêntica à cadastrada na Meta <span style="color:#ef4444">*</span></label>
      <input id="redirectUri" type="text" class="mono" oninput="refreshChips()" />
    </div>

    <div class="field">
      <label>URL da sua API <span style="color:#ef4444">*</span></label>
      <input id="apiUrl" type="text" placeholder="https://api.meusaas.com" />
    </div>

    <div class="field">
      <label>Workspace External ID <span style="color:#ef4444">*</span></label>
      <input id="workspaceId" type="text" placeholder="workspace_abc123" />
    </div>

    <div class="field">
      <label>Nome do Canal <span style="color:#ef4444">*</span></label>
      <input id="channelName" type="text" placeholder="Ex: Suporte WhatsApp" />
    </div>
  </div>

  <div class="steps">
    <div class="step" id="s1"></div>
    <div class="step" id="s2"></div>
    <div class="step" id="s3"></div>
    <div class="step" id="s4"></div>
  </div>

  <button class="btn-connect" onclick="launchMetaSignup()">
    <svg viewBox="0 0 24 24" fill="white"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
    Conectar com Facebook / Meta
  </button>

  <div class="result-box" id="resultBox">
    <div class="result-label">Authorization Code recebido</div>
    <div class="result-code" id="resultCode">—</div>
  </div>

  <div class="log-wrap">
    <div class="log-header">
      <span class="log-title">Log de eventos</span>
      <button class="btn-clear" onclick="clearLog()">Limpar</button>
    </div>
    <div id="log"></div>
  </div>

</div>

<script>
  var DEFAULT_APP_ID    = '960439420062430';
  var DEFAULT_CONFIG_ID = '977458031900449';
  var DEFAULT_REDIRECT  = 'https://kamala-driveable-overfavorably.ngrok-free.dev/oauth/callback';

  // ── Permissões OAuth ──────────────────────────────────────────────────────
  var OAUTH_SCOPES = [
    'business_management',
    'whatsapp_business_management',
    'whatsapp_business_messaging'
  ].join(',');

  var OAUTH_STATE  = 'meta-oauth';
  // ─────────────────────────────────────────────────────────────────────────

  var popupWatcher = null;
  var signupSessionInfo = {};

  // ── Se esta página foi aberta pela Meta como callback (tem ?code= na URL),
  //    envia o code para o opener e fecha.
  (function handleCallback() {
    var params = new URLSearchParams(window.location.search);
    var code   = params.get('code');
    var error  = params.get('error');

    if (error) {
      if (window.opener) {
        window.opener.postMessage({ error: error }, '*');
        window.close();
      }
      return;
    }

    if (code) {
      if (window.opener) {
        window.opener.postMessage({ code: code }, '*');
        window.close();
      } else {
        document.addEventListener('DOMContentLoaded', function() {
          document.getElementById('resultCode').textContent = code;
          document.getElementById('resultBox').classList.add('show');
          log('Code recebido via redirect direto: ' + code.slice(0,12) + '...', 'success');
        });
      }
      return;
    }
  })();

  (function init() {
    document.getElementById('appId').value       = DEFAULT_APP_ID;
    document.getElementById('configId').value    = DEFAULT_CONFIG_ID;
    document.getElementById('redirectUri').value = DEFAULT_REDIRECT;
    refreshChips();
    setStep(1);
    log('Pronto. Preencha os campos e clique em Conectar.', 'info');
    log('Scopes: ' + OAUTH_SCOPES, 'info');
  })();

  function launchMetaSignup() {
    var appId       = getVal('appId')       || DEFAULT_APP_ID;
    var configId    = getVal('configId')    || DEFAULT_CONFIG_ID;
    var redirectUri = getVal('redirectUri') || DEFAULT_REDIRECT;
    var apiUrl      = getVal('apiUrl');
    var workspaceId = getVal('workspaceId');
    var channelName = getVal('channelName');

    if (!apiUrl || !workspaceId || !channelName) {
      log('ERRO: Preencha URL da API, Workspace ID e Nome do Canal.', 'error');
      return;
    }

    sessionStorage.setItem('oauth_apiUrl',      apiUrl);
    sessionStorage.setItem('oauth_workspaceId', workspaceId);
    sessionStorage.setItem('oauth_channelName', channelName);
    sessionStorage.setItem('oauth_redirectUri', redirectUri);

    // ── Monta URL OAuth com scope e state ────────────────────────────────
    var params = new URLSearchParams({
      client_id     : appId,
      redirect_uri  : redirectUri,
      response_type : 'code',
      scope         : OAUTH_SCOPES,
      state         : OAUTH_STATE,
      config_id     : configId,
      override_default_response_type: 'true',
      extras        : JSON.stringify({ setup: {}, sessionInfoVersion: '3' })
    });

    var oauthUrl = 'https://www.facebook.com/v25.0/dialog/oauth?' + params.toString();
    // ────────────────────────────────────────────────────────────────────

    log('Abrindo popup OAuth...', 'info');
    log('App ID: ' + appId, 'info');
    log('Config ID: ' + configId, 'info');
    log('Redirect URI: ' + redirectUri, 'info');
    log('Scopes: ' + OAUTH_SCOPES, 'info');
    log('State: ' + OAUTH_STATE, 'info');
    setStatus('loading', 'Aguardando autorização na janela Meta...');
    setStep(2);

    var popup = window.open(oauthUrl, 'MetaOAuth', 'width=620,height=720,scrollbars=yes');

    if (!popup) {
      log('ERRO: Popup bloqueado. Permita popups para esta página.', 'error');
      setStatus('error', 'Popup bloqueado');
      setStep(1);
      return;
    }

    function onMessage(event) {
      if (!event.data) return;

      var signupMessage = parseEmbeddedSignupMessage(event);
      if (signupMessage) {
        handleEmbeddedSignupMessage(signupMessage);
        return;
      }

      if (event.data.error) {
        log('Erro OAuth: ' + event.data.error, 'error');
        setStatus('error', 'Erro na autorização');
        setStep(1);
        window.removeEventListener('message', onMessage);
        clearInterval(popupWatcher);
        return;
      }

      if (!event.data.code) return;

      window.removeEventListener('message', onMessage);
      clearInterval(popupWatcher);

      var code = event.data.code;
      log('Authorization code recebido! (' + code.slice(0,12) + '...)', 'success');
      document.getElementById('resultCode').textContent = code;
      document.getElementById('resultBox').classList.add('show');

      var savedApiUrl      = sessionStorage.getItem('oauth_apiUrl')      || apiUrl;
      var savedWorkspaceId = sessionStorage.getItem('oauth_workspaceId') || workspaceId;
      var savedChannelName = sessionStorage.getItem('oauth_channelName') || channelName;
      var savedRedirectUri = sessionStorage.getItem('oauth_redirectUri') || redirectUri;

      sendToApi(code, savedApiUrl, savedWorkspaceId, savedChannelName, savedRedirectUri, signupSessionInfo);
    }

    window.addEventListener('message', onMessage);

    popupWatcher = setInterval(function() {
      if (popup.closed) {
        clearInterval(popupWatcher);
        window.removeEventListener('message', onMessage);
        log('Popup fechado sem retornar code.', 'warn');
        setStatus('ready', 'Pronto para tentar novamente');
        setStep(1);
      }
    }, 500);
  }

  function sendToApi(code, apiUrl, workspaceId, channelName, redirectUri, sessionInfo) {
    setStep(3);
    setStatus('loading', 'Enviando code para sua API...');
    log('POST ' + apiUrl + '/channels/meta/official/connect', 'info');

    sessionInfo = sessionInfo || {};

    fetch(apiUrl + '/channels/meta/official/connect', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        workspaceExternalId: workspaceId,
        name               : channelName,
        code               : code,
        redirectUri        : redirectUri,
        businessId         : sessionInfo.businessId || sessionInfo.business_id || null,
        wabaId             : sessionInfo.wabaId || sessionInfo.waba_id || null,
        phoneNumberId      : sessionInfo.phoneNumberId || sessionInfo.phone_number_id || null
      })
    })
    .then(function(res) {
      return res.text().then(function(text) {
        var data;
        try { data = JSON.parse(text); } catch(e) { data = { raw: text }; }
        if (!res.ok) {
          log('ERRO HTTP ' + res.status + ': ' + JSON.stringify(data), 'error');
          setStatus('error', 'Erro ' + res.status);
          setStep(1);
          return;
        }
        log('Canal salvo com sucesso!', 'success');
        log(JSON.stringify(data, null, 2), 'success');
        setStatus('ready', 'Canal conectado com sucesso!');
        setStep(4);
      });
    })
    .catch(function(err) {
      log('Erro de rede: ' + String(err), 'error');
      setStatus('error', 'Erro de rede');
      setStep(1);
    });
  }

  function parseEmbeddedSignupMessage(event) {
    if (!isFacebookOrigin(event.origin)) return null;

    var data = event.data;

    if (typeof data === 'string') {
      try {
        data = JSON.parse(data);
      } catch(e) {
        return null;
      }
    }

    if (!data || data.type !== 'WA_EMBEDDED_SIGNUP') return null;

    return data;
  }

  function handleEmbeddedSignupMessage(message) {
    if (message.event === 'FINISH' || message.event === 'FINISH_WHATSAPP_BUSINESS_APP_ONBOARDING') {
      signupSessionInfo = message.data || {};
      sessionStorage.setItem('oauth_signupInfo', JSON.stringify(signupSessionInfo));
      log(
        'Embedded Signup finalizado. businessId=' +
          (signupSessionInfo.businessId || signupSessionInfo.business_id || '—') +
          ', wabaId=' +
          (signupSessionInfo.wabaId || signupSessionInfo.waba_id || '—') +
          ', phoneNumberId=' +
          (signupSessionInfo.phoneNumberId || signupSessionInfo.phone_number_id || '—'),
        'success'
      );
      return;
    }

    if (message.event === 'ERROR') {
      log('Erro Embedded Signup: ' + ((message.data && message.data.error_message) || 'erro desconhecido'), 'error');
      return;
    }

    if (message.data && message.data.current_step) {
      log('Embedded Signup interrompido em: ' + message.data.current_step, 'warn');
    }
  }

  function isFacebookOrigin(origin) {
    return origin === 'https://www.facebook.com' || origin === 'https://web.facebook.com';
  }

  function getVal(id) { return document.getElementById(id).value.trim(); }

  function setStatus(type, msg) {
    document.getElementById('sdkDot').className      = 'status-dot ' + type;
    document.getElementById('sdkStatus').textContent = msg;
  }

  function setStep(n) {
    for (var i = 1; i <= 4; i++) {
      var el = document.getElementById('s' + i);
      el.className = 'step' + (i < n ? ' done' : i === n ? ' active' : '');
    }
  }

  function log(msg, type) {
    type = type || '';
    var container = document.getElementById('log');
    var ts    = new Date().toTimeString().slice(0,8);
    var entry = document.createElement('div');
    entry.className = 'log-entry';
    entry.innerHTML = '<span class="log-ts">' + ts + '</span><span class="log-msg ' + type + '">' + msg + '</span>';
    container.appendChild(entry);
    container.scrollTop = container.scrollHeight;
  }

  function clearLog() {
    document.getElementById('log').innerHTML = '';
    log('Log limpo.', 'warn');
  }

  function refreshChips() {
    document.getElementById('chipAppId').textContent    = getVal('appId')      || '—';
    document.getElementById('chipConfigId').textContent = getVal('configId')   || '—';
    document.getElementById('chipRedirect').textContent = getVal('redirectUri') || '—';
  }
</script>

</body>
</html>
